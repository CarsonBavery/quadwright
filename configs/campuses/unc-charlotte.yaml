# UNC Charlotte main campus. bbox from OSM/Nominatim via `ox.geocode_to_gdf`
# (its envelope -- the campus's real shape only covers ~64% of that
# rectangle, so boundary_query below is what actually scopes buildings).

campus:
  name: unc-charlotte
  bbox: [-80.74675, 35.296975, -80.721494, 35.315842]   # west, south, east, north
  boundary_query: "UNC Charlotte"   # drops off-campus buildings the bbox rectangle sweeps in
  include_outside_boundary: []   # add real-but-technically-outside places here as you find them,
    # e.g. "Jamil Niner Student Pantry" -- a real campus service just outside the strict polygon
  lidar_project: "NC_Phase_4_CentralWestNC_GEIGER_A16/NC_Phase4_Mecklenburg_2016"   # real 2016 ground-return LIDAR

scale:
  target_size_mm: [450, 300]
  vertical_exaggeration: 1.5

tool:
  diameter_mm: 3.175
  type: flat_end_mill

materials:
  base: walnut
  buildings: maple

heights:
  default_m: 12
  meters_per_level: 3.5

tiers:
  merge_below_tool_diameters: 3
  rotate_above_tool_diameters: 20

roofs:
  engine: rules

outputs: [part_stl, base_stl, heightmap, setup_sheets, tier_report]
